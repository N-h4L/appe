<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Appe</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="app-title">
        <!-- # <div class="status-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Checking service</span>
        </div> -->
        <h1 id="app-title">Snake Game</h1>
        <p class="lede">Use Arrow keys or WASD to control. Wrap borders, avoid yourself, and reach 500 points to win!</p>
        
        <div class="game-container">
          <div class="score-board">
            <div class="score-box">
              <span class="score-label">Score</span>
              <span id="score" class="score-val">0</span>
            </div>
            <div class="score-box">
              <span class="score-label">Target</span>
              <span class="score-val">500</span>
            </div>
            <div class="score-box">
              <span class="score-label">High Score</span>
              <span id="high-score" class="score-val">0</span>
            </div>
          </div>
          
          <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            <div id="game-overlay" class="game-overlay">
              <div class="overlay-content">
                <h2 id="overlay-title">Snake</h2>
                <p id="overlay-msg">Press Space or click Start to Play</p>
                <button id="start-btn" class="btn">Start Game</button>
              </div>
            </div>
          </div>
          
          <!-- On-screen controls for mobile/touch screens -->
          <div class="mobile-controls">
            <button id="ctrl-up" class="ctrl-btn">▲</button>
            <div class="ctrl-row">
              <button id="ctrl-left" class="ctrl-btn">◀</button>
              <button id="ctrl-down" class="ctrl-btn">▼</button>
              <button id="ctrl-right" class="ctrl-btn">▶</button>
            </div>
          </div>
        </div>

        <!-- # <div class="actions">
          <a href="/health">Health</a>
          <a href="/api/info">API Info</a>
        </div> -->
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
